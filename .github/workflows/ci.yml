name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # The tool itself must run on Node 18 with runtime dependencies only.
  runtime-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node bin/htmledit.js --version
      - name: Serve a page
        run: |
          printf '<!doctype html><p>hello</p>' > /tmp/r.html
          node bin/htmledit.js /tmp/r.html --no-open --port 8765 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/ | grep -q 'data-he='
          curl -fsS http://127.0.0.1:8765/__he/overlay.js | grep -q '__heChartForm'
